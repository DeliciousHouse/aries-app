# Publish ghcr.io/delicioushouse/aries-app:sha-<full SHA> for every master commit
# whose Tests run passed. The Dora pull-deploy controller
# (scripts/release/dora_pull_deploy.py) resolves that tag to a digest and swaps
# production with scripts/release/ubuntu-docker-replace.mjs. Publishing is not
# deployment; `latest` and semver tags stay with release.yml.
name: publish-master-image

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-master-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_run's github.sha is the default-branch tip, not the tested commit,
      # so the tag and OCI revision are set explicitly from head_sha.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/delicioushouse/aries-app
          tags: type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

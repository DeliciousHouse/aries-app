name: Tests

# Runs the FULL TypeScript test suite (not just the curated `verify` subset)
# plus typecheck + lint on every PR and every push to master. This closes the
# rot vector that let 63 contract tests go red unnoticed: the `verify` gate is
# a curated subset, so tests outside `verify` were never enforced.
#
# `full-suite` IS now the required status check on master, and branch
# protection additionally requires branches to be up to date (strict), so a
# green run against a base master has since moved past no longer permits a
# merge. That closes the stale-green window but pushes the rebasing onto
# whoever is merging; the merge queue is what automates it, hence the
# `merge_group` trigger below.

on:
  pull_request:
  push:
    branches: [master]
  # Merge-queue entries are a DIFFERENT event: GitHub builds a temporary
  # `gh-readonly-queue/...` ref with the PR rebased onto the queue head and
  # waits for the required checks to report against THAT ref. A workflow that
  # only listens on `pull_request` never starts there, so `full-suite` would
  # stay pending forever and the queue would stall on the first entry rather
  # than fail loudly. This trigger must exist BEFORE "Require merge queue" is
  # switched on in branch protection.
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feedback-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aries_test
          POSTGRES_PASSWORD: aries_test_password
          POSTGRES_DB: aries_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aries_test -d aries_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: aries_test
      DB_PASSWORD: aries_test_password
      DB_NAME: aries_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Required PostgreSQL concurrency and recovery suites
        run: >-
          npx --no-install tsx --test --test-concurrency=1
          tests/feedback-reports-store.requires-infra.test.ts
          tests/scheduled-worker-claim-lock-order.test.ts
          tests/scheduled-worker-sweep-lock-order.test.ts
          tests/scheduled-dispatch-cutover.requires-infra.test.ts
          tests/insights-llm-calls-drop.requires-infra.test.ts

  # S8-2/AA-125 (gap E4). tests/insights-endpoints.test.ts holds the ONLY
  # behaviour tests for the eight /insights section endpoints, and it needs live
  # Postgres PLUS seed data — so in `full-suite` (which sets no DB env) all 23
  # self-skip and the endpoints have effectively been untested. This job gives
  # them a home without touching that gate's self-skip semantics: `full-suite`
  # still runs the file with no DB env and still counts it skipped.
  #
  # The stakes are not theoretical. The first real run of this file found an
  # assertion that had been wrong since S2-3 gave `activeTimes` a real heatmap —
  # nothing caught it precisely because the file never executed in CI.
  insights-endpoints-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aries_test
          POSTGRES_PASSWORD: aries_test_password
          POSTGRES_DB: aries_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aries_test -d aries_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: aries_test
      DB_PASSWORD: aries_test_password
      DB_NAME: aries_test
      APP_BASE_URL: https://aries.example.com
      NEXT_TELEMETRY_DISABLED: '1'
      # Declares intent: this is the one job that opts into the live-DB split.
      # It is NOT the mechanism — `requireDbEnvOrSkip` gates on the five DB_*
      # vars above and never reads this flag; only scripts/list-requires-infra.mjs
      # does. Kept so the job says out loud what it is, and so a future move to
      # that runner needs no env change. See CLAUDE.md.
      ARIES_TEST_REQUIRES_INFRA_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize schema
        run: npm run db:init

      - name: Seed insights fixtures
        # Creates the 'insights-demo' tenant the test resolves in its `before`
        # hook: 1 YouTube account, 30 days of account metrics, 15 posts, 50
        # comments. Without it the file fails fast with an explicit
        # "Seed tenant not found" rather than passing vacuously.
        run: npm run db:seed-insights

      - name: Insights section endpoints against live Postgres
        shell: bash
        run: |
          set -o pipefail
          # --test-reporter=tap is load-bearing for the assertion step below:
          # it emits a machine-readable `# pass N` / `# skipped N` summary. The
          # default reporter writes `ℹ pass N` when piped, which the grep would
          # silently fail to match — turning the guard into the very no-op it
          # exists to prevent.
          npx --no-install tsx --test --test-reporter=tap --test-concurrency=1 \
            tests/insights-endpoints.test.ts 2>&1 | tee /tmp/insights-endpoints.log

      - name: Assert the suite actually ran
        # The failure mode this job must not have. `requireDbEnvOrSkip` makes
        # every test SKIP when the DB env is wrong, and a skipped test is a
        # passing test — so a broken service container, a renamed env var or a
        # failed seed would leave this job green having verified nothing. A
        # silent no-op gate is worse than no gate: it reports coverage that does
        # not exist. Assert on the counts, not on the exit code.
        shell: bash
        run: |
          set -euo pipefail
          # awk, not `grep -oP`: PCRE mode is unavailable under some locales
          # ("grep: -P supports only unibyte and UTF-8 locales"), and a guard
          # that errors out is a guard that does not guard.
          skipped=$(awk '/^# skipped /{print $3; exit}' /tmp/insights-endpoints.log)
          passed=$(awk  '/^# pass /{print $3; exit}'    /tmp/insights-endpoints.log)
          echo "pass=${passed:-?} skipped=${skipped:-?}"
          if [ -z "${skipped:-}" ] || [ -z "${passed:-}" ]; then
            echo "::error::Could not read the TAP summary — the suite did not report counts."
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error::${skipped} insights endpoint tests SKIPPED. They self-skip when the DB env is absent, so this job verified nothing."
            exit 1
          fi
          if [ "$passed" -lt 20 ]; then
            echo "::error::Only ${passed} tests passed; this file carries 23. Something is not being collected."
            exit 1
          fi
          echo "✓ ${passed} insights endpoint tests executed against live Postgres, 0 skipped"

  hermes-sidecar-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify pinned Hermes sidecar generation contract
        run: node tests/hermes-sidecar-integration.mjs

  full-suite:
    needs: feedback-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      CODE_ROOT: ${{ github.workspace }}
      APP_BASE_URL: https://aries.example.com
      NEXTAUTH_URL: https://aries.example.com
      AUTH_URL: https://aries.example.com
      AUTH_TRUST_HOST: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      ARTIFACT_DIR: .artifacts/verification
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 matches the production runtime (Dockerfile
          # node:24-bookworm) and the repository's declared engine range.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "${ARTIFACT_DIR}"
          npm ci 2>&1 | tee "${ARTIFACT_DIR}/install.log"

      - name: Typecheck + lint (route types, banned patterns, repo boundary, protocol drift)
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "${ARTIFACT_DIR}/lint.log"

      - name: Pipeline monitor fixture suite (ops/aries-pipeline-monitor.py)
        shell: bash
        run: |
          set -o pipefail
          # AA-117: the pipeline monitor is the ONLY thing that would have caught
          # the 2026-08-06→10 outage (4 days of failed weekly runs, nobody told).
          # It ships its own stdlib-only fixture suite that nothing ran, so a
          # regression in its alert or suppression logic would be silent — and a
          # bug in exactly that suppression (over-suppressing genuine gateway-key
          # 401s, i.e. hiding a real outage) was already caught once by a human
          # reading the diff. stdlib only: no pip install, and fcntl is present
          # on ubuntu (it is POSIX-only, which is why this cannot run on Windows).
          python3 ops/aries-pipeline-monitor.py --self-test 2>&1 | tee "${ARTIFACT_DIR}/pipeline-monitor-selftest.log"

      - name: Full test suite (all tests/**, concurrency=1)
        shell: bash
        run: |
          set -o pipefail
          # Full suite, no quarantine. The two tenant-context tests that 400'd on
          # a clean runner are fixed (each pins its own per-test mkdtemp DATA_ROOT).
          # The export below is belt-and-suspenders for any future test that relies
          # on an ambient DATA_ROOT: $RUNNER_TEMP is always writable on the runner,
          # avoiding the uncreatable /home/node/data fallback. Set here in the step
          # shell (not job env) because the `runner` context is unavailable at
          # job-env level — using ${{ runner.temp }} there is a startup failure.
          export DATA_ROOT="${RUNNER_TEMP}/aries-data"
          mapfile -t TEST_FILES < <(find tests -name '*.test.ts' | sort)
          echo "Running ${#TEST_FILES[@]} test files"
          npx --no-install tsx --test --test-concurrency=1 "${TEST_FILES[@]}" 2>&1 | tee "${ARTIFACT_DIR}/full-tests.log"

      - name: Build
        env:
          NODE_ENV: production
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "${ARTIFACT_DIR}/build.log"

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

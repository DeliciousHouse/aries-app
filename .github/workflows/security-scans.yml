name: Security Scans

# Warn-only rollout through 2026-09-05. SECURITY.md defines the criteria for
# promoting new secret findings and fixable high/critical advisories to blocking.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '20 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: npm audit (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Audit dependencies
        id: npm-audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Surface dependency warning
        if: ${{ steps.npm-audit.outcome == 'failure' }}
        run: |
          echo "::warning title=npm audit warning::Dependency audit reported high or critical findings or could not complete. Review the workflow log and use the private security process in SECURITY.md."
          {
            echo "### npm audit"
            echo
            echo "Warn-only: high or critical findings were reported, or the audit could not complete. Triage the log privately under SECURITY.md."
          } >> "${GITHUB_STEP_SUMMARY}"

  secret-scan:
    name: gitleaks full history (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --silent --show-error \
            --output "${archive_path}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive_path}" | sha256sum --check
          mkdir -p "${bin_dir}"
          tar -xzf "${archive_path}" -C "${bin_dir}" gitleaks
          chmod 0755 "${bin_dir}/gitleaks"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Scan all commits
        shell: bash
        run: |
          set +e
          gitleaks git \
            --no-banner \
            --no-color \
            --redact=100 \
            --verbose \
            --exit-code 2 \
            --log-opts="--all" \
            .
          scan_status=$?
          set -e

          if [[ "${scan_status}" -eq 0 ]]; then
            echo "No secret findings detected." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${scan_status}" -eq 2 ]]; then
            echo "::warning title=Gitleaks findings::Potential secrets were detected in git history. Details are redacted; use the private response process in SECURITY.md. Do not rewrite history from this warning alone."
            {
              echo "### Gitleaks"
              echo
              echo "Warn-only: potential secrets were detected in full git history. Triage privately under SECURITY.md."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "::warning title=Gitleaks scan error::Gitleaks exited with status ${scan_status}. The warn-only rollout does not block this change; investigate the scanner failure."
          exit 0
